steps:
  # 1. Build Docker container image from root directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/c5-deploy:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/c5-deploy:latest'
      - '-f'
      - './Dockerfile'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/c5-deploy:$COMMIT_SHA'

  # 3. Run docker-compose tests/build (Optional step using docker-compose)
  - name: 'gcr.io/cloud-builders/docker-compose'
    args:
      - '-f'
      - 'docker-compose.yml'
      - 'up'
      - '--build'
      - '--exit-code-from'
      - 'c5'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'c5-deploy'
      - '--image=gcr.io/$PROJECT_ID/c5:$COMMIT_SHA'
      - '--region=asia-south2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=$PORT'

images:
  - 'gcr.io/$PROJECT_ID/c5-deploy:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/c5-deploy:latest'
